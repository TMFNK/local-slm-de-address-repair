[project]
name = "local-slm-de-address-repair"
version = "0.1.0"
description = "LoRA SFT repair of German address records with MiniCPM5-1B, local Q4 eval, audit log."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "MbitAI" }]

dependencies = [
  "datasets>=3.0",
  "jsonschema>=4.23",
  "peft>=0.15",
  "pyyaml>=6.0",
  "transformers>=4.55",
  "trl>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addr_repair"]
