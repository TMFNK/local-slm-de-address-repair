# Resolved Colab T4 config from the 2026-09-10 SFT run (checkpoint-939).
# Derived at runtime from configs/train_colab.yaml: Tesla T4 has no bf16
# (compute capability 7.5), so the notebook wrote fp16 and a smaller honesty
# sweep. Do not treat configs/train_colab.yaml as this run's config.
base_config: "configs/model.yaml"
lora_config: "configs/lora.yaml"
data_config: "configs/data.yaml"

output_dir: "/content/drive/MyDrive/local-slm-de-address-repair/checkpoints"
logging_dir: "/content/drive/MyDrive/local-slm-de-address-repair/logs"

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
# ~3% of ~939 steps; warmup_ratio does not exist in transformers 5.x.
warmup_steps: 30
num_train_epochs: 3
bf16: false
fp16: true
max_seq_length: 2048
eval_strategy: steps
eval_steps: 200
save_steps: 200
save_total_limit: 3
logging_steps: 50
report_to: none
seed: 7
# Standard LlamaForCausalLM per the official MiniCPM TRL recipe: no remote code.
trust_remote_code: false

# Honesty selection on a T4: 100 val records, shorter generation.
# Winner = max mean(review_precision, 1-damage, F1).
val_samples: 100
val_gen_max_tokens: 256
