# Colab GPU training. Notebook calls scripts/train_sft.py with this file.
base_config: "configs/model.yaml"
lora_config: "configs/lora.yaml"
data_config: "configs/data.yaml"

output_dir: "/content/drive/MyDrive/local-slm-de-address-repair/checkpoints"
logging_dir: "/content/drive/MyDrive/local-slm-de-address-repair/logs"

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
# ~3% of ~939 steps; warmup_ratio does not exist in transformers 5.x.
warmup_steps: 30
num_train_epochs: 3
bf16: true
fp16: false
max_seq_length: 2048
eval_strategy: steps
eval_steps: 200
save_steps: 200
save_total_limit: 3
logging_steps: 50
report_to: none
seed: 7
# Standard LlamaForCausalLM per the official MiniCPM TRL recipe: no remote code.
trust_remote_code: false

# Step 6 checkpoint choice (scripts/train_sft.py scores retained checkpoints
# on this many val records; winner = max mean(review_precision, 1-damage, F1)).
val_samples: 200
val_gen_max_tokens: 512
